# Cluster definition for the argo-labs.
#
# Topology:
#   - 1 control-plane node
#   - 2 worker nodes (the first is labeled ingress-ready=true and exposes
#     host ports 8080/8443 -> container 80/443, so an Ingress controller
#     installed in a later milestone can route traffic from the host
#     without recreating the cluster)
#
# Why 8080/8443 on the host instead of 80/443?
#   Avoids conflicts with anything already listening on privileged ports.
#   You can change them later if you prefer; just remember to recreate
#   the cluster (port mappings are baked in at create-time).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: argo-labs

nodes:
  - role: control-plane
    image: kindest/node:v1.35.1

  - role: worker
    image: kindest/node:v1.35.1
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

  - role: worker
    image: kindest/node:v1.35.1
