apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-app
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: landing-page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: landing-page
          configMap:
            name: dev-app-content
