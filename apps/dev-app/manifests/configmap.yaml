apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-app-content
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>argo-labs</title>
        <style>
          :root {
            color-scheme: light;
            --bg-top: #07111f;
            --bg-bottom: #0f2b46;
            --panel: rgba(7, 17, 31, 0.74);
            --line: rgba(122, 203, 255, 0.24);
            --text: #e8f4ff;
            --muted: #9ec5df;
            --accent: #44d1ff;
            --accent-2: #7cf7c9;
            --warn: #ffcc66;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--text);
            background:
              radial-gradient(circle at top left, rgba(68, 209, 255, 0.2), transparent 30%),
              radial-gradient(circle at bottom right, rgba(124, 247, 201, 0.16), transparent 28%),
              linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
            display: grid;
            place-items: center;
            padding: 24px;
          }

          .shell {
            width: min(980px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(12px);
          }

          .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 22px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.03);
          }

          .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
          }

          .dot.red { background: #ff6b6b; }
          .dot.yellow { background: #ffd166; }
          .dot.green { background: #7cf7c9; }

          .title {
            margin-left: 10px;
            font-size: 0.95rem;
            color: var(--muted);
            letter-spacing: 0.04em;
          }

          .content {
            padding: 40px 28px 32px;
          }

          .eyebrow {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(124, 247, 201, 0.35);
            color: var(--accent-2);
            font-size: 0.76rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
          }

          h1 {
            margin: 18px 0 14px;
            font-size: clamp(2.2rem, 6vw, 4.4rem);
            line-height: 0.95;
          }

          p {
            margin: 0;
            max-width: 62ch;
            color: var(--muted);
            font-size: 1.02rem;
            line-height: 1.7;
          }

          .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 30px;
          }

          .card {
            padding: 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(158, 197, 223, 0.15);
          }

          .card strong {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-size: 1rem;
          }

          .card span {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
          }

          .terminal {
            margin-top: 28px;
            padding: 18px;
            border-radius: 18px;
            background: #05101c;
            border: 1px solid rgba(68, 209, 255, 0.18);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            color: #d9f3ff;
            overflow-x: auto;
          }

          .prompt {
            color: var(--accent);
          }

          .note {
            margin-top: 18px;
            color: var(--warn);
            font-size: 0.92rem;
          }

          @media (max-width: 640px) {
            .content {
              padding: 28px 20px 24px;
            }
          }
        </style>
      </head>
      <body>
        <main class="shell">
          <div class="topbar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">argo-labs / dev-app</span>
          </div>

          <section class="content">
            <span class="eyebrow">GitOps Lab</span>
            <h1>Argo CD is syncing this page from Git.</h1>
            <p>
              This demo app is part of <strong>argo-labs</strong>: a local learning lab for
              ArgoCD and Argo Rollouts on a kind cluster. The page you are seeing is not baked
              into the container image. It is mounted from a ConfigMap so Git remains the source
              of truth for what nginx serves.
            </p>

            <div class="grid">
              <article class="card">
                <strong>Cluster</strong>
                <span>kind on a laptop, built for repeatable experiments.</span>
              </article>
              <article class="card">
                <strong>Controller</strong>
                <span>ArgoCD watches this repo and reconciles the manifests.</span>
              </article>
              <article class="card">
                <strong>Next Step</strong>
                <span>Progressive delivery with Argo Rollouts and controlled traffic shifts.</span>
              </article>
            </div>

            <div class="terminal">
              <div><span class="prompt">$</span> kubectl get application -n argo-cd-labs</div>
              <div>first-argocd-demo-app   Synced   Healthy</div>
              <br />
              <div><span class="prompt">$</span> kubectl scale deployment dev-app --replicas=3 -n development</div>
              <div><span class="prompt">$</span> argocd app get first-argocd-demo-app</div>
              <div>OutOfSync -> Synced, because Git wins.</div>
            </div>

            <div class="note">
              Change this HTML in Git, let ArgoCD reconcile, and the cluster will follow.
            </div>
          </section>
        </main>
      </body>
    </html>
