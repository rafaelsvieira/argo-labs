apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include backend.name . }}-maintenance-presync"
  namespace: "{{ .Values.namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: maintenance-flag
          image: redis:7-alpine
          env:
            - name: REDIS_HOST
              value: "{{ include backend.name . }}-redis"
            - name: MAINTENANCE_SECONDS
              value: "{{ .Values.maintenanceWindowSeconds }}"
            - name: MAINTENANCE_MESSAGE
              value: "Deployment in progress for {{ .Values.appName }} {{ .Values.environment }}. Counting is paused until the maintenance window closes."
          command:
            - sh
            - -c
            - |
              set -eu
              for attempt in $(seq 1 30); do
                if redis-cli -h "${REDIS_HOST}" ping >/dev/null 2>&1; then
                  redis-cli -h "${REDIS_HOST}" set click-counter:maintenance "${MAINTENANCE_MESSAGE}" ex "${MAINTENANCE_SECONDS}"
                  echo "Maintenance flag set for ${MAINTENANCE_SECONDS}s"
                  exit 0
                fi
                sleep 2
              done

              echo "Redis is not reachable yet; skipping maintenance flag for cold start"
