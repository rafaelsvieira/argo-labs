apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-app
  namespace: argo-cd-labs
spec:
  project: default

  source:
    repoURL: https://github.com/rafaelsvieira/argo-labs
    targetRevision: main
    path: apps/dev-app
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: development

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
