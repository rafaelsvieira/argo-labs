apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: click-lab
  namespace: argo-cd-labs
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/rafaelsvieira/argo-labs
        revision: main
        files:
          - path: apps/backend/values-*.yaml
          - path: apps/frontend/values-*.yaml

  template:
    metadata:
      name: "{{ .appName }}-{{ .environment }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/rafaelsvieira/argo-labs
        targetRevision: main
        path: "apps/{{ index .path.segments 1 }}"
        helm:
          valueFiles:
            - "{{ .path.filename }}"
          releaseName: "{{ .appName }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          selfHeal: true
          prune: true
